name: npm publish

# Manual npm publication of an exact release candidate. It never runs on push or
# merge. A release is the declared publish set (tooling/audits/repository-policy/
# publish-set.json: @muxui/schema, @muxui/catalog, @muxui/tooling, @muxui/react;
# Decision 0032), each package with its own rc version: the version inputs
# below, `version` for @muxui/react, which must be 0.1.0-rc.N (Roadmap R1
# exit, Decision 0023 amendment 01), and one for each of the others, an rc of
# its source version, <source version>-rc.N.
#
# A release publishes only the packages whose version units changed (Decision
# 0032 item 9). A package whose version input is empty is reused: it keeps the
# version, bytes, and provenance of the prior release, which `prior-release`
# names, so a release that reuses anything needs it and cannot be the first.
# The dry run fetches each reused package from the public registry by its exact
# version, never following a redirect, and holds it to the integrity that
# release recorded and to the attestation the registry holds for it: the SLSA
# statement must name those bytes, the recorded commit, and this repository's
# publish workflow on main. `next` must still be that version. The dry run also
# runs `npm audit signatures` on them in a project outside the checkout, which
# verifies the attestation's Sigstore signature and the registry's signature.
# The prior release manifest, and the manifest of any release it reused from,
# must be committed in the release ledger as releases/<hex>.json, for the
# release id muxui-portfolio:<hex> (releases/README.md).
# The dry run never repacks a reused package and checks the whole tuple with it.
# Which packages publish is the release's choice: nothing classifies the change,
# so a changed package left empty is reused as it was. At least one package is
# published. The candidate artifact holds the published tarballs, in publish
# order, and the manifest. The publish job publishes only those, and before the
# first publish and again before each one checks every reused package's version
# document, attestation statement, and `next` against the registry; the
# signatures are the dry run's.
#
# - mode=dry-run (default): `prepare` builds the candidate set for the input
#   versions on the dispatched commit, rehearses `npm publish --dry-run` for
#   every tarball in publish order, verifies the set against its portfolio
#   release manifest, and uploads the tarballs and the manifest. When main's
#   push CI already passed the full plan for this exact commit, it runs only
#   `generate:check` and `release-prepare.mjs`; otherwise it runs the full
#   `pnpm release:prepare` (Decision 0030). No environment or secret.
#   tarball-sha512 (the sha512 integrity of each published tarball, comma
#   separated; the dry run's summary lists them) may be empty here; when given
#   it must be exactly those.
#   The dry run also says which release it compares with: `prior-release` names
#   the prior portfolio release manifest (a tracked releases/<hex>.json), or
#   `first-portfolio-release` declares the first one (E-P2.1-04). Exactly one of
#   them; the preparation rejects a published version that is not ahead of the
#   prior release, or a reused package whose recorded range does not admit a
#   sibling's new version, and records the outcome in the manifest as
#   preparation.verification.versionCheck.
# - mode=publish (main only): `prepare` promotes the dry run named by dry-run-id
#   (verifies it, downloads its artifact by id, and checks the candidate set
#   against the commit and the inputs) without building anything, so the prior
#   release setting is the dry run's, recorded in its manifest and never
#   re-derived from these inputs. The version inputs and tarball-sha512 must be
#   the dry run's: a package is published exactly when its version input is not
#   empty, and the authorization lists exactly the published tarballs. A reused
#   package is fetched again from the registry, checked against the retained
#   manifest of the release that published it and its attestation. Then one `publish` job, in the `npm-publish`
#   environment (main only, no required reviewer; Decision 0033), publishes the
#   set to `next` in publish order. It is the only job with `id-token: write`.
#   A package that exists on npm publishes through trusted publishing: its
#   `npm publish` exchanges that identity for a short-lived token scoped to the
#   package, so each needs its own trusted publisher (Decision 0032 item 10).
#   A package that does not exist yet cannot (`npm trust` needs an existing
#   package), so its first publish alone uses the temporary NPM_TOKEN secret of
#   the npm-publish environment, which only the `Publish the set in order` step
#   sees; the run refuses before any publish when a first publish has no token
#   and never falls back. Provenance is signed with the OIDC identity either way.
#   The token is revoked after the first release's read-back. Each new package's
#   trusted publisher is set up just before its next real release, since npm
#   expires one after 2 days without a publish; until then a publish of that
#   existing package stops on authentication and never falls back to a token.
#   Per published package the publish job preflights
#   the registry, rechecks for drift, publishes with provenance, and reads back
#   the version, integrity, provenance attestation, and `next`; it stops at the
#   first failure and never continues to a later package. A failure prints a
#   recovery plan (Decision 0023 amendment 01) and executes none of it.
# - mode=registry-preflight: the publish preflight alone for every version
#   input that is not empty, read-only against the public registry, with no
#   environment or credentials.
#
# Preflight, per package: the version must be absent from the registry. A first
# publish (package absent) must be its rc.1. Otherwise the dist-tags must be
# exactly latest and next, the version must be the next release candidate after
# next (next = rc.N, the version rc.N+1, same base version) or the rc.1 of a
# strictly higher base version (Decision 0035), and latest is recorded; after
# publishing, next must be the candidate and latest unchanged. Any other state
# stops for a decision. The registry sets `latest` on a first publish; nothing
# here claims or moves a dist-tag, and no deprecate, unpublish, dist-tag, or
# owner command runs anywhere.
#
# Record `tarball-sha512` from a dry run of this workflow, not a local run. The
# archive is byte-stable across Linux runners, but Node's gzip header stores
# the build OS (3 on Linux, 19 on macOS), so a macOS digest never matches CI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "@muxui/react candidate version, 0.1.0-rc.N (e.g. 0.1.0-rc.2); empty reuses the prior release's @muxui/react"
        required: false
        type: string
        default: ''
      schema-version:
        description: "@muxui/schema candidate version, <source version>-rc.N (e.g. 0.6.0-rc.1); empty reuses the prior release's; every mode"
        required: false
        type: string
        default: ''
      catalog-version:
        description: "@muxui/catalog candidate version, <source version>-rc.N (e.g. 2.1.0-rc.1); empty reuses the prior release's; every mode"
        required: false
        type: string
        default: ''
      tooling-version:
        description: "@muxui/tooling candidate version, <source version>-rc.N (e.g. 1.1.0-rc.1); empty reuses the prior release's; every mode"
        required: false
        type: string
        default: ''
      prior-release:
        description: "Prior portfolio release manifest, a tracked releases/<hex>.json (releases/README.md lists them); dry-run needs this or first-portfolio-release, and a release that reuses a package needs this"
        required: false
        type: string
        default: ''
      first-portfolio-release:
        description: "This is the first portfolio release, so no prior manifest is tracked and nothing is reused; dry-run needs this or prior-release"
        required: false
        type: boolean
        default: false
      tarball-sha512:
        description: "Integrity (sha512-...) of each tarball this release publishes, comma separated, from a dry run of this workflow; optional for dry-run"
        required: false
        type: string
        default: ''
      dry-run-id:
        description: Run id of the successful dry run, on main at this commit, whose npm-candidate artifact mode=publish promotes (publish only)
        required: false
        type: string
        default: ''
      mode:
        description: dry-run prepares and checks only; publish promotes the named dry run and publishes it; registry-preflight only reads the public registry
        required: true
        type: choice
        options: [dry-run, publish, registry-preflight]
        default: dry-run

permissions:
  contents: read

# One entry for every member of the publish set, as release-set.mjs, release-lineage.mjs, and
# npm-publication.mjs read them: its version, or empty to reuse it. Inputs reach scripts only through the environment.
env:
  MUXUI_RELEASE_VERSIONS: '@muxui/schema=${{ inputs.schema-version }},@muxui/catalog=${{ inputs.catalog-version }},@muxui/tooling=${{ inputs.tooling-version }},@muxui/react=${{ inputs.version }}'

jobs:
  # Read-only public registry state for every version input: what the publish
  # preflight would accept or stop on. Trusted publishing has no stored
  # credential to verify; OIDC is exchanged only inside the publish job.
  registry-preflight:
    if: inputs.mode == 'registry-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            tooling/audits/repository-policy/publish-set.json
            tooling/audits/repository-policy/src/npm-publication.mjs
            tooling/audits/repository-policy/src/release-set.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Registry preflight (read-only)
        run: node tooling/audits/repository-policy/src/npm-publication.mjs preflight-set

  prepare:
    if: inputs.mode == 'dry-run' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    # A dry run without a usable main CI run runs the full check graph (stages in
    # parallel), then packs.
    timeout-minutes: 90
    # actions: read lets the dry run look up main's CI run and a publish run
    # verify and download the dry run's artifact. This job has no OIDC access.
    permissions:
      contents: read
      actions: read
    outputs:
      node-version: ${{ steps.node.outputs.version }}
    steps:
      - name: Require main for publish mode
        if: inputs.mode == 'publish' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Publish needs main::mode=publish only runs from refs/heads/main, not $REF."
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # Fails in seconds, before the long release preparation. An empty version reuses @muxui/react.
      - name: Validate version input
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: node tooling/audits/repository-policy/src/npm-publication.mjs validate-version

      # Every package that is published needs an rc of its source version, at least one is published, and the first
      # portfolio release reuses nothing; this fails before the long preparation too.
      - name: Validate release versions
        env:
          MUXUI_FIRST_PORTFOLIO_RELEASE: ${{ inputs.first-portfolio-release && 'true' || '' }}
        run: node tooling/audits/repository-policy/src/release-set.mjs validate-versions

      # E-P2.1-04: a dry run must say which release it compares with, and fails in seconds when it does not.
      # Publish promotes the dry run's candidate, so it checks the shape only. Inputs reach the script through the environment.
      - name: Validate prior release inputs
        env:
          MODE: ${{ inputs.mode }}
          PRIOR_RELEASE: ${{ inputs.prior-release }}
          FIRST_RELEASE: ${{ inputs.first-portfolio-release }}
        run: |
          set -euo pipefail
          if [ -n "$PRIOR_RELEASE" ] && [[ ! "$PRIOR_RELEASE" =~ ^releases/[0-9a-f]{32}\.json$ ]]; then
            echo "::error title=Prior release path::prior-release must be empty or a release ledger path, releases/<32 hex digits>.json."
            exit 1
          fi
          if [ "$MODE" = dry-run ]; then
            if [ -n "$PRIOR_RELEASE" ] && [ "$FIRST_RELEASE" = true ]; then
              echo "::error title=Prior release ambiguous::Set prior-release or first-portfolio-release, not both."
              exit 1
            fi
            if [ -z "$PRIOR_RELEASE" ] && [ "$FIRST_RELEASE" != true ]; then
              echo "::error title=Prior release required::Set prior-release to the prior portfolio release manifest, or first-portfolio-release for the first one."
              exit 1
            fi
          fi

      - name: Record Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      # Corepack installs the pnpm version pinned by package.json packageManager.
      - name: Activate pinned pnpm
        if: inputs.mode == 'dry-run'
        run: |
          corepack enable
          corepack install
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        if: inputs.mode == 'dry-run'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install workspace
        if: inputs.mode == 'dry-run'
        run: pnpm install --frozen-lockfile

      # Main's push CI plans and passes the full graph, so a green run for this
      # exact commit already proved what release:prepare would rerun (Decision
      # 0030). Anything else, including an unreadable run, is the full path.
      - name: Find main CI proof
        id: mainci
        if: inputs.mode == 'dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/audits/repository-policy/src/release-lineage.mjs main-ci

      # Browser checks use the runner's preinstalled Chrome, as in ci.yml.
      - name: Prepare release candidate
        if: inputs.mode == 'dry-run'
        env:
          MAIN_CI_MODE: ${{ steps.mainci.outputs.mode }}
          MUXUI_RELEASE_MAIN_CI_RUN: ${{ steps.mainci.outputs.run-id }}
          MUXUI_RELEASE_MAIN_CI_ATTEMPT: ${{ steps.mainci.outputs.attempt }}
          # Read by release-prepare.mjs, which refuses neither or both, and a first-release claim a tracked manifest contradicts.
          MUXUI_PRIOR_RELEASE_MANIFEST: ${{ inputs.prior-release }}
          MUXUI_FIRST_PORTFOLIO_RELEASE: ${{ inputs.first-portfolio-release && 'true' || '' }}
        run: |
          set -euo pipefail
          if [ "$MAIN_CI_MODE" = reuse ]; then
            { pnpm generate && pnpm generate:check && node tooling/audits/repository-policy/src/release-prepare.mjs; } 2>&1 | tee "$RUNNER_TEMP/release-prepare.log"
          else
            pnpm release:prepare 2>&1 | tee "$RUNNER_TEMP/release-prepare.log"
          fi

      # Publish promotes the dry run's candidate instead of rebuilding it. These
      # steps run before the publish job, so a run that cannot publish stops
      # before any registry write.
      - name: Verify dry run
        id: dryrun
        if: inputs.mode == 'publish'
        env:
          DRY_RUN_ID: ${{ inputs.dry-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: node tooling/audits/repository-policy/src/release-lineage.mjs dry-run

      # Downloads exactly the artifact id and attempt the step above verified (not
      # a name lookup), checks the ZIP against the API digest, inspects its entries,
      # and extracts only the two expected files into a fresh directory outside the
      # checkout. No general extractor sees the archive.
      - name: Fetch dry-run candidate
        if: inputs.mode == 'publish'
        env:
          DRY_RUN_ID: ${{ inputs.dry-run-id }}
          DRY_RUN_ATTEMPT: ${{ steps.dryrun.outputs.attempt }}
          ARTIFACT_ID: ${{ steps.dryrun.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.dryrun.outputs.artifact-digest }}
          ARTIFACT_SIZE: ${{ steps.dryrun.outputs.artifact-size }}
          CANDIDATE_DIR: ${{ runner.temp }}/promoted
          GH_TOKEN: ${{ github.token }}
        run: node tooling/audits/repository-policy/src/release-lineage.mjs fetch-candidate

      - name: Verify promoted candidate
        if: inputs.mode == 'publish'
        env:
          EXPECTED_SHA512: ${{ inputs.tarball-sha512 }}
          DRY_RUN_ID: ${{ inputs.dry-run-id }}
          DRY_RUN_ATTEMPT: ${{ steps.dryrun.outputs.attempt }}
          CANDIDATE_DIR: ${{ runner.temp }}/promoted
        run: node tooling/audits/repository-policy/src/release-lineage.mjs candidate

      - name: Collect candidate
        id: candidate
        env:
          PROMOTED_DIR: ${{ inputs.mode == 'publish' && format('{0}/promoted', runner.temp) || '' }}
        run: |
          set -euo pipefail
          if [ -n "$PROMOTED_DIR" ]; then
            source_dir=$PROMOTED_DIR
          else
            source_dir=$(sed -n 's/^R1 exit artifacts written to //p' "$RUNNER_TEMP/release-prepare.log" | tail -n 1)
          fi
          if [ -z "$source_dir" ] || [ ! -d "$source_dir" ]; then
            echo "::error title=Candidate missing::The candidate artifact directory is missing."
            exit 1
          fi
          dir="$RUNNER_TEMP/npm-candidate"
          mkdir -p "$dir"
          cp "$source_dir"/*.tgz "$source_dir"/*.release-manifest.json "$dir"/
          manifests=("$dir"/*.release-manifest.json)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error title=Candidate ambiguous::Expected exactly one release manifest."
            exit 1
          fi
          manifest=${manifests[0]}
          {
            echo "### Release candidate"
            echo
            jq -r '.packages[] | "- \(.name): `\(.version)` (\(.role)), \(.integrity)"' "$manifest"
            echo "- release manifest digest: \`$(jq -r .digest "$manifest")\`"
            echo "- source revision: \`$(jq -r .source.revision "$manifest")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate $(jq -r '[.packages[] | "\(.name)@\(.version)"] | join(" ")' "$manifest")"
          {
            echo "dir=$dir"
            echo "manifest=$manifest"
          } >> "$GITHUB_OUTPUT"

      # Reports the exact publish command of every published package, in publish order, without a token or
      # registry write. Provenance is only generated by a real publish, so --dry-run needs no OIDC.
      - name: Rehearse npm publish (dry run)
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          npm_config_engine_strict: 'false'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mapfile -t files < <(jq -r '.packages[] | select(.role == "published") | .file' "$MANIFEST")
          for file in "${files[@]}"; do
            npm publish "$CANDIDATE_DIR/$file" --tag next --provenance --access public \
              --registry=https://registry.npmjs.org --dry-run
          done

      # The candidate set is read the way a promotion reads it: exactly the expected files, each tarball the
      # recorded bytes, every published package built from this commit, and the versions the inputs name. A
      # dry run may leave tarball-sha512 empty; when given it must be the @muxui/react tarball's.
      - name: Check candidate against inputs
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
          EXPECTED_SHA512: ${{ inputs.tarball-sha512 }}
        run: node tooling/audits/repository-policy/src/release-lineage.mjs prepared

      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/npm-candidate
          if-no-files-found: error
          # Long enough for a publish run to promote it.
          retention-days: 30

  publish:
    if: inputs.mode == 'publish' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    # The read-back allows about 5 minutes for a version and 10 for its dist-tags, for each of the four packages.
    timeout-minutes: 90
    # The environment scopes the temporary NPM_TOKEN secret, limits deployments to main, and records
    # them. It has no required reviewer (Decision 0033). One job publishes the whole set.
    environment: npm-publish
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC identity for a short-lived
      # publish token for each `npm publish`, and provenance is signed with it.
      # No other job has it.
      id-token: write
    # Never run two publishes at once, and never cancel one mid-flight.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      # Only the publication script, the set reader it imports, and the set it
      # reads; the candidate comes from the uploaded artifact.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tooling/audits/repository-policy/publish-set.json
            tooling/audits/repository-policy/src/npm-publication.mjs
            tooling/audits/repository-policy/src/release-set.mjs
          sparse-checkout-cone-mode: false

      # No registry-url, so no .npmrc and no _authToken placeholder: for an existing
      # package npm >= 11.5.1 exchanges the GitHub OIDC identity for a short-lived
      # token scoped to the package being published and holds it in memory for that
      # command only (its CLI config layer, never written to a file). If the exchange
      # fails, npm has no token and stops with ENEEDAUTH before signing provenance, so
      # nothing reaches the transparency log. A first publish gets the temporary token
      # as npm config in that one child process's environment. --registry and the
      # candidate's publishConfig pin the registry.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.prepare.outputs.node-version }}

      # Node 24.19.0 bundles npm 11.17.0; this fails closed if that ever regresses.
      - name: Require trusted-publishing npm
        run: node tooling/audits/repository-policy/src/npm-publication.mjs check-npm

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/npm-candidate

      # The candidate as the publish job must trust it: exactly the set's
      # tarballs and manifest, every tarball the manifest's recorded bytes, built
      # from this commit and this release, the versions the inputs name, and the
      # authorized @muxui/react digest.
      - name: Re-verify candidate
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/npm-candidate
          EXPECTED_SHA512: ${{ inputs.tarball-sha512 }}
        run: node tooling/audits/repository-policy/src/npm-publication.mjs verify-candidate

      # Preflights every package read-only, then for each in publish order:
      # drift recheck, `npm publish --tag next --provenance`, and registry
      # read-back of its version, integrity, provenance, and next. The first
      # failure stops the set and prints the recovery plan, which it does not run.
      # The version document is read first; the packument's dist-tags can stay
      # CDN-cached for minutes after a publish, so both reads retry.
      - name: Publish the set in order
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/npm-candidate
          EXPECTED_SHA512: ${{ inputs.tarball-sha512 }}
          # Temporary: used for a package that does not exist on npm yet, never for an existing one.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node tooling/audits/repository-policy/src/npm-publication.mjs publish-set

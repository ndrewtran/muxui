name: npm publish

# Manual npm publication of an exact @muxui/react release candidate. It never
# runs on push or merge. The version input must be 0.1.0-rc.N (Roadmap R1 exit:
# rc.1, then any number of later rcs in sequence, Decision 0023 amendment 01).
#
# - mode=dry-run (default): `prepare` runs `pnpm release:prepare` for the input
#   version on the dispatched commit, reports the candidate version and
#   tarball-sha512, rehearses `npm publish --dry-run`, and uploads the tarball
#   and release manifest. No environment or secret, so no approval.
#   tarball-sha512 may be empty here; when given it must match.
# - mode=publish (main only): after `prepare` reports and checks the
#   candidate, the single `publish` job waits for Andrew's npm-publish
#   environment approval. It re-verifies the uploaded tarball, runs the
#   read-only registry preflight, publishes to `next` through npm trusted
#   publishing (OIDC, no token), and reads back integrity, provenance, and
#   dist-tags.
# - mode=registry-preflight: the publish preflight alone, read-only against
#   the public registry, with no environment, credentials, or approval.
#
# Preflight: the version must be absent from the registry. A first publish
# (package absent) must be rc.1. Otherwise the dist-tags must be exactly
# latest and next, the version must be the next release candidate after next
# (next = rc.N, the version rc.N+1), and latest is recorded; after publishing,
# next must be the candidate and latest unchanged. Any other state stops for a
# decision. The registry sets `latest` on a first publish; nothing here claims
# or moves a dist-tag, and no deprecate, unpublish, dist-tag, or owner command
# runs anywhere.
#
# Record `tarball-sha512` from a dry run of this workflow, not a local run. The
# archive is byte-stable across Linux runners, but Node's gzip header stores
# the build OS (3 on Linux, 19 on macOS), so a macOS digest never matches CI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected candidate version, 0.1.0-rc.N (e.g. 0.1.0-rc.2)
        required: true
        type: string
      tarball-sha512:
        description: Candidate tarball integrity (sha512-...) from a dry run of this workflow; optional for dry-run
        required: false
        type: string
        default: ''
      mode:
        description: dry-run prepares and checks only; publish also publishes after approval; registry-preflight only reads the public registry
        required: true
        type: choice
        options: [dry-run, publish, registry-preflight]
        default: dry-run

permissions:
  contents: read

jobs:
  # Read-only public registry state for the version input: what the publish
  # preflight would accept or stop on. Trusted publishing has no stored
  # credential to verify; OIDC is exchanged only inside the publish job.
  registry-preflight:
    if: inputs.mode == 'registry-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            tooling/audits/repository-policy/src/npm-publication.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Registry preflight (read-only)
        env:
          VERSION: ${{ inputs.version }}
        run: node tooling/audits/repository-policy/src/npm-publication.mjs preflight

  prepare:
    if: inputs.mode == 'dry-run' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    # release:prepare runs the full check graph (stages in parallel), then packs.
    timeout-minutes: 90
    outputs:
      node-version: ${{ steps.node.outputs.version }}
    steps:
      - name: Require main for publish mode
        if: inputs.mode == 'publish' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Publish needs main::mode=publish only runs from refs/heads/main, not $REF."
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # Fails in seconds, before the long release preparation.
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: node tooling/audits/repository-policy/src/npm-publication.mjs validate-version

      - name: Record Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      # Corepack installs the pnpm version pinned by package.json packageManager.
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Browser checks use the runner's preinstalled Chrome, as in ci.yml.
      - name: Prepare release candidate
        env:
          MUXUI_RELEASE_CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pnpm release:prepare 2>&1 | tee "$RUNNER_TEMP/release-prepare.log"

      - name: Collect candidate
        id: candidate
        run: |
          set -euo pipefail
          source_dir=$(sed -n 's/^R1 exit artifacts written to //p' "$RUNNER_TEMP/release-prepare.log" | tail -n 1)
          if [ -z "$source_dir" ] || [ ! -d "$source_dir" ]; then
            echo "::error title=Candidate missing::release:prepare did not report its artifact directory."
            exit 1
          fi
          dir="$RUNNER_TEMP/npm-candidate"
          mkdir -p "$dir"
          cp "$source_dir"/*.tgz "$source_dir"/*.release-manifest.json "$dir"/
          tarballs=("$dir"/*.tgz)
          manifests=("$dir"/*.release-manifest.json)
          if [ "${#tarballs[@]}" -ne 1 ] || [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error title=Candidate ambiguous::Expected exactly one tarball and one release manifest."
            exit 1
          fi
          tarball=${tarballs[0]}
          manifest=${manifests[0]}
          version=$(tar -xzOf "$tarball" package/package.json | jq -r .version)
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w 0)"
          {
            echo "### Release candidate"
            echo
            echo "- version: \`$version\`"
            echo "- tarball-sha512: \`$integrity\`"
            echo "- source revision: \`$(jq -r .source.revision "$manifest")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate $version $integrity"
          {
            echo "tarball=$tarball"
            echo "manifest=$manifest"
          } >> "$GITHUB_OUTPUT"

      # Reports the exact publish command without a token or registry write.
      # Provenance is only generated by a real publish, so --dry-run needs no OIDC.
      - name: Rehearse npm publish (dry run)
        env:
          TARBALL: ${{ steps.candidate.outputs.tarball }}
          npm_config_engine_strict: 'false'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm publish "$TARBALL" --tag next --provenance --access public \
            --registry=https://registry.npmjs.org --dry-run

      # Publish mode requires a matching digest; a dry run may leave it empty.
      - name: Check candidate against inputs
        env:
          TARBALL: ${{ steps.candidate.outputs.tarball }}
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MODE: ${{ inputs.mode }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA512: ${{ inputs.tarball-sha512 }}
        run: |
          set -euo pipefail
          version=$(tar -xzOf "$TARBALL" package/package.json | jq -r .version)
          integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w 0)"
          failed=0
          if [ "$version" != "$EXPECTED_VERSION" ] || [ "$(jq -r .package.version "$MANIFEST")" != "$EXPECTED_VERSION" ]; then
            echo "::error title=Version mismatch::Candidate is $version; the version input is $EXPECTED_VERSION."
            failed=1
          fi
          if [ -z "$EXPECTED_SHA512" ] && [ "$MODE" != publish ]; then
            echo "::notice title=Digest not checked::No tarball-sha512 input; the candidate is $integrity."
          elif [ -z "$EXPECTED_SHA512" ]; then
            echo "::error title=Digest required::mode=publish needs the tarball-sha512 input; the candidate is $integrity."
            failed=1
          elif [ "$integrity" != "$EXPECTED_SHA512" ] || [ "$(jq -r .artifact.integrity "$MANIFEST")" != "$EXPECTED_SHA512" ]; then
            echo "::error title=Integrity mismatch::Candidate tarball is $integrity; the tarball-sha512 input is $EXPECTED_SHA512."
            failed=1
          fi
          exit "$failed"

      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/npm-candidate
          if-no-files-found: error
          retention-days: 3

  publish:
    if: inputs.mode == 'publish' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    # The read-back allows about 5 minutes for the version and 10 for dist-tags.
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC identity for a short-lived
      # publish token, and provenance is signed with it. No other job has it.
      id-token: write
    # Never run two publishes at once, and never cancel one mid-flight.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      # Only the read-only registry check script; the candidate comes from the
      # uploaded artifact.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: tooling/audits/repository-policy/src/npm-publication.mjs
          sparse-checkout-cone-mode: false

      # No registry-url, so no .npmrc and no _authToken placeholder: npm >= 11.5.1
      # exchanges the GitHub OIDC identity for a short-lived token scoped to
      # @muxui/react and holds it in memory for this command only (its CLI config
      # layer, never written to a file). If the exchange fails, npm has no token
      # and stops with ENEEDAUTH before signing provenance, so nothing reaches the
      # transparency log. --registry and the candidate's publishConfig pin the
      # registry.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.prepare.outputs.node-version }}

      # Node 24.19.0 bundles npm 11.17.0; this fails closed if that ever regresses.
      - name: Require trusted-publishing npm
        run: node tooling/audits/repository-policy/src/npm-publication.mjs check-npm

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/npm-candidate

      - name: Re-verify candidate
        id: candidate
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA512: ${{ inputs.tarball-sha512 }}
        run: |
          set -euo pipefail
          tarballs=("$RUNNER_TEMP"/npm-candidate/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error title=Candidate missing::Expected exactly one tarball in the npm-candidate artifact."
            exit 1
          fi
          tarball=${tarballs[0]}
          version=$(tar -xzOf "$tarball" package/package.json | jq -r .version)
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w 0)"
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error title=Version mismatch::Artifact is $version; the version input is $EXPECTED_VERSION."
            exit 1
          fi
          if [ -z "$EXPECTED_SHA512" ] || [ "$integrity" != "$EXPECTED_SHA512" ]; then
            echo "::error title=Integrity mismatch::Artifact is $integrity; the tarball-sha512 input is ${EXPECTED_SHA512:-empty}."
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # Read-only public registry reads. Records the dist-tags the publish and
      # read-back must preserve.
      - name: Registry preflight (read-only)
        id: preflight
        env:
          VERSION: ${{ inputs.version }}
        run: node tooling/audits/repository-policy/src/npm-publication.mjs preflight

      - name: Publish to next
        env:
          VERSION: ${{ inputs.version }}
          TARBALL: ${{ steps.candidate.outputs.tarball }}
          PRE_KIND: ${{ steps.preflight.outputs.kind }}
          PRE_LATEST: ${{ steps.preflight.outputs.latest }}
          PRE_NEXT: ${{ steps.preflight.outputs.next }}
          npm_config_engine_strict: 'false'
        run: |
          set -euo pipefail
          # Stop on registry drift since the preflight.
          node tooling/audits/repository-policy/src/npm-publication.mjs recheck
          cd "$RUNNER_TEMP"
          npm publish "$TARBALL" --tag next --provenance --access public \
            --registry=https://registry.npmjs.org

      # Read-only. The version document is read first; the packument's dist-tags
      # can stay CDN-cached for minutes after a publish, so both reads retry.
      - name: Read back registry state
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA512: ${{ inputs.tarball-sha512 }}
          PRE_KIND: ${{ steps.preflight.outputs.kind }}
          PRE_LATEST: ${{ steps.preflight.outputs.latest }}
          PRE_NEXT: ${{ steps.preflight.outputs.next }}
        run: node tooling/audits/repository-policy/src/npm-publication.mjs read-back

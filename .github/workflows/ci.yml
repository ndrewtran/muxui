name: Deterministic workspace checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read
  # Pull-request plans read earlier runs' jobs and reuse records.
  actions: read

# Only pull requests share (and cancel) a group; every main run keeps its own so
# quick successive merges never drop a pending full run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests plan owner-scoped groups from the merge-base diff; push,
  # schedule, and manual runs plan the full workspace graph. Pull requests
  # also mark groups that passed in an earlier run of the same PR, with no
  # affecting change since, as reused (never for fork PRs). Set repository variable
  # MUXUI_CI_REUSE=off to always run every group.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Corepack installs the pnpm version pinned by package.json packageManager.
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      # Only this job saves the store cache; run jobs restore it read-only.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Drop packages the current lockfile no longer uses before the cache
      # post-step saves the store, so a restored older store never accumulates.
      - name: Prune pnpm store
        run: pnpm store prune

      - name: Plan check groups
        id: plan
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          MUXUI_CI_REUSE: ${{ vars.MUXUI_CI_REUSE }}
          MUXUI_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MUXUI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node tooling/audits/repository-policy/src/ci-impact.mjs --plan --github-output \
              --reuse-record "$RUNNER_TEMP/ci-reuse-record.json"
          else
            node tooling/audits/repository-policy/src/ci-impact.mjs --plan --github-output --full
          fi

      # Later runs of this PR read this record to reuse passed groups.
      - name: Upload reuse record
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-reuse-record
          path: ${{ runner.temp }}/ci-reuse-record.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  # Each group is self-contained: it repeats its generation prerequisites in a
  # fresh runner, so "re-run failed jobs" repeats only the failed groups.
  run:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    name: run ${{ matrix.group.id }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    # A reused group passed in an earlier run of this PR; it only reports that.
    steps:
      - name: Reuse earlier pass
        if: matrix.group.reusedFrom != ''
        env:
          GROUP_ID: ${{ matrix.group.id }}
          REUSED_FROM: ${{ matrix.group.reusedFrom }}
        run: echo "::notice title=Reused::$GROUP_ID passed in $REUSED_FROM; changes since do not affect it"

      - uses: actions/checkout@v4
        if: matrix.group.reusedFrom == ''
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: matrix.group.reusedFrom == ''
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        if: matrix.group.reusedFrom == ''
        run: |
          corepack enable
          corepack install
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store
        if: matrix.group.reusedFrom == ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install workspace
        if: matrix.group.reusedFrom == ''
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.group.id }} checks
        if: matrix.group.reusedFrom == ''
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          MUXUI_CI_GROUP: ${{ matrix.group.id }}
        run: |
          scope=--full
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then scope=; fi
          node tooling/audits/repository-policy/src/ci-impact.mjs --group "$MUXUI_CI_GROUP" $scope

      - name: Upload Storybook colour diagnostics
        if: always() && matrix.group.kind == 'storybook' && matrix.group.reusedFrom == ''
        uses: actions/upload-artifact@v4
        with:
          name: storybook-colour-diagnostics-${{ matrix.group.id }}
          path: ${{ runner.temp }}/storybook-colour-audit
          if-no-files-found: ignore
          retention-days: 3

  # The single required status check: passes only when planning succeeded and
  # every planned group passed (an empty plan passes).
  check:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every planned group to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_RESULT: ${{ needs.run.result }}
          GROUPS: ${{ needs.plan.outputs.groups }}
        run: |
          echo "plan=$PLAN_RESULT run=$RUN_RESULT groups=$GROUPS"
          if [ "$PLAN_RESULT" != success ]; then exit 1; fi
          if [ "$GROUPS" = '[]' ] && [ "$RUN_RESULT" = skipped ]; then exit 0; fi
          [ "$RUN_RESULT" = success ]

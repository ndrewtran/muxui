name: Deterministic workspace checks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Select full-path Storybook browser audit coverage
        id: storybook-audit
        if: github.event_name != 'pull_request'
        env:
          MUXUI_STORYBOOK_AUDIT_EVENT: ${{ github.event_name }}
        run: |
          node tooling/audits/repository-policy/src/storybook-audit-selection.mjs --github-output \
            | tee "$RUNNER_TEMP/storybook-audit-selection.txt" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/storybook-audit-selection.txt"

      - name: Plan and run owner-scoped pull request checks
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          MUXUI_STORYBOOK_A11Y_WORKERS: '1'
          MUXUI_STORYBOOK_COLORS_WORKERS: '2'
          MUXUI_STORYBOOK_COLORS_ARTIFACT_DIR: ${{ runner.temp }}/storybook-colour-audit
        run: node tooling/audits/repository-policy/src/ci-impact.mjs

      - name: Run full deterministic checks (manual and schedule)
        if: github.event_name != 'pull_request'
        env:
          MUXUI_STORYBOOK_AUDIT_MODE: ${{ steps.storybook-audit.outputs.mode }}
          MUXUI_STORYBOOK_AUDIT_REASON: ${{ steps.storybook-audit.outputs.reason }}
          MUXUI_STORYBOOK_AUDIT_EVENT: ${{ github.event_name }}
          MUXUI_STORYBOOK_A11Y_WORKERS: '1'
          MUXUI_STORYBOOK_COLORS_WORKERS: '2'
          MUXUI_STORYBOOK_COLORS_ARTIFACT_DIR: ${{ runner.temp }}/storybook-colour-audit
        run: pnpm check:all

      - name: Upload Storybook colour diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-colour-diagnostics
          path: ${{ runner.temp }}/storybook-colour-audit
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify theme authoring in browser
        if: github.event_name != 'pull_request'
        run: pnpm --filter @muxui/scale check:browser

      - name: Verify complex React interactions in Chrome
        if: github.event_name != 'pull_request'
        run: pnpm --filter @muxui/react check:browser

      - name: Install isolated Tailwind consumer
        if: github.event_name != 'pull_request'
        run: pnpm --dir tests/fixtures/tailwind-consumer install --ignore-workspace --frozen-lockfile

      - name: Compile isolated Tailwind consumer
        if: github.event_name != 'pull_request'
        run: pnpm --dir tests/fixtures/tailwind-consumer check

      - name: Verify generation identity
        if: github.event_name != 'pull_request'
        run: pnpm generate:check

name: Deterministic workspace checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

# Only pull requests share (and cancel) a group; every main run keeps its own so
# quick successive merges never drop a pending full run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every event runs the same fixed jobs. Each job is self-contained: it installs,
  # generates every projection in dependency order, then runs its own checks, so
  # "re-run failed jobs" repeats only the failed ones. The job names are the
  # release proof's expected list (CI_JOBS in
  # tooling/audits/repository-policy/src/release-lineage.mjs); keep them in step.
  run:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    # Firefox and WebKit jobs add a setup allowance for Playwright's apt install.
    timeout-minutes: ${{ matrix.timeout || 20 }}
    env:
      # Generation below covers every prerequisite, so package scripts skip their
      # standalone prerequisite generation (prepare-prerequisites.mjs).
      MUXUI_PREREQUISITES_READY: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: packages
            checks: |
              pnpm --filter @muxui/schema run check
              pnpm --filter @muxui/tokens run check
              pnpm --filter @muxui/catalog run check
              pnpm --filter @muxui/tooling run check
              pnpm --dir tests/fixtures/tailwind-consumer install --ignore-workspace --frozen-lockfile
              pnpm --dir tests/fixtures/tailwind-consumer run check
          - job: apps
            checks: |
              pnpm --filter @muxui/docs run check
              pnpm --filter @muxui/react-playground run check
              pnpm --filter @muxui/scale run check
            generate-check: true
          - job: tooling
            checks: |
              pnpm --filter @muxui/repository-policy run check
              pnpm --filter @muxui/figma run check
          - job: react
            checks: pnpm --filter @muxui/react run check
          # React browser tests: files that call browserEngines() run in every
          # engine, the rest in Chromium only (src/browser-test-files.mjs).
          - { job: browser chromium 1/2, tests: cross-engine, engine: chromium, shard: 1/2 }
          - { job: browser chromium 2/2, tests: cross-engine, engine: chromium, shard: 2/2 }
          - { job: browser firefox 1/2, tests: cross-engine, engine: firefox, shard: 1/2, timeout: 50 }
          - { job: browser firefox 2/2, tests: cross-engine, engine: firefox, shard: 2/2, timeout: 50 }
          - { job: browser webkit 1/2, tests: cross-engine, engine: webkit, shard: 1/2, timeout: 50 }
          - { job: browser webkit 2/2, tests: cross-engine, engine: webkit, shard: 2/2, timeout: 50 }
          - { job: browser chromium-only 1/3, tests: chromium-only, shard: 1/3 }
          - { job: browser chromium-only 2/3, tests: chromium-only, shard: 2/3 }
          - { job: browser chromium-only 3/3, tests: chromium-only, shard: 3/3 }
          # Scale's browser checks; the docs one builds the docs site first.
          - job: browser scale
            checks: |
              pnpm --filter @muxui/scale run check:browser
              pnpm --filter @muxui/scale run check:browser:docs
          - job: storybook-a11y
            storybook: a11y
          - job: storybook
            checks: pnpm --filter @muxui/react-storybook run generate:check
            storybook: other
          # The published packages claim Node >=24.19.0 <27 but the toolchain is
          # Node 24: pack the release candidate on it as the release does, then
          # install and run it on the newest claimed Node (release-node-consumer.mjs).
          - job: node-26-consumer
            consumer-node: 26.13.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Corepack installs the pnpm version pinned by package.json packageManager.
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      # Only the packages job saves the store cache; the others restore it read-only.
      - name: Cache pnpm store
        if: matrix.job == 'packages'
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Restore pnpm store
        if: matrix.job != 'packages'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Drop packages the current lockfile no longer uses before the cache
      # post-step saves the store, so a restored older store never accumulates.
      - name: Prune pnpm store
        if: matrix.job == 'packages'
        run: pnpm store prune

      # Chromium uses the runner's preinstalled Chrome. Firefox and WebKit use
      # Playwright's builds, cached per runner OS, architecture, image OS,
      # playwright-core version and engine; their system libraries install every
      # time from the runner image's apt mirror, which can crawl, so the install
      # has its own limit inside the job's setup allowance.
      - name: Read playwright-core version
        id: playwright
        if: matrix.engine == 'firefox' || matrix.engine == 'webkit'
        run: |
          : "${ImageOS:?runner image OS identity is required for the browser cache}"
          echo "image-os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./packages/react/package.json').devDependencies['playwright-core']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: matrix.engine == 'firefox' || matrix.engine == 'webkit'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image-os }}-${{ steps.playwright.outputs.version }}-${{ matrix.engine }}

      - name: Install Playwright browsers
        if: matrix.engine == 'firefox' || matrix.engine == 'webkit'
        timeout-minutes: 25
        env:
          ENGINE: ${{ matrix.engine }}
        run: pnpm --filter @muxui/react exec playwright-core install --with-deps "$ENGINE"

      - name: Generate
        id: generate
        run: pnpm --recursive --sort --workspace-concurrency=1 --if-present run generate

      # Each check step still runs when an earlier check step failed, so one run
      # reports every failing step; none runs when generation failed.
      - name: Package checks
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && matrix.checks != '' }}
        timeout-minutes: 20
        run: ${{ matrix.checks }}

      # Regenerates from the committed tree and compares; `generate` alone could
      # repair stale projections instead of failing on them.
      - name: Generation identity
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && matrix.generate-check }}
        timeout-minutes: 20
        run: pnpm generate:check

      - name: React browser tests
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && matrix.tests != '' }}
        timeout-minutes: 20
        env:
          TESTS: ${{ matrix.tests }}
          SHARD: ${{ matrix.shard }}
          # Empty for the Chromium-only files, which launch Chromium themselves.
          MUXUI_BROWSER_ENGINES: ${{ matrix.engine }}
        run: |
          files=$(node tooling/audits/repository-policy/src/browser-test-files.mjs "$TESTS")
          # shellcheck disable=SC2086 # one word per file
          pnpm --filter @muxui/react exec node --test --test-concurrency=1 --test-shard="$SHARD" $files

      # The full Storybook audit: no family, story, or proof selection.
      - name: Storybook tests
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && matrix.storybook != '' }}
        timeout-minutes: 20
        env:
          SUITE: ${{ matrix.storybook }}
          MUXUI_STORYBOOK_AUDIT_EVENT: check:all
          MUXUI_STORYBOOK_AUDIT_FORCE: '1'
          MUXUI_STORYBOOK_A11Y_WORKERS: '2'
          MUXUI_STORYBOOK_COLORS_WORKERS: '2'
        run: |
          unset MUXUI_STORYBOOK_AUDIT_PROOF MUXUI_STORYBOOK_FAMILIES MUXUI_STORYBOOK_STORY_IDS \
            MUXUI_STORYBOOK_FAMILY_FILTER MUXUI_STORYBOOK_FAMILY
          a11y=test/storybook-a11y.test.mjs
          files=()
          if [ "$SUITE" = a11y ]; then
            files=("$a11y")
          else
            for file in apps/react-storybook/test/*.test.mjs; do
              file=${file#apps/react-storybook/}
              [ "$file" = "$a11y" ] || files+=("$file")
            done
          fi
          pnpm --filter @muxui/react-storybook exec node --test --test-concurrency=1 "${files[@]}"

      - name: Pack release candidate
        id: pack
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && matrix.consumer-node != '' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          node tooling/audits/repository-policy/src/release-prepare.mjs 2>&1 | tee "$RUNNER_TEMP/release-prepare.log"
          echo "dir=$(sed -n 's/^Release candidate written to //p' "$RUNNER_TEMP/release-prepare.log" | tail -n 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.pack.outcome == 'success'
        with:
          node-version: ${{ matrix.consumer-node }}

      - name: Release consumer on the newest claimed Node
        if: steps.pack.outcome == 'success'
        timeout-minutes: 20
        env:
          CANDIDATE_DIR: ${{ steps.pack.outputs.dir }}
        run: node tooling/audits/repository-policy/src/release-node-consumer.mjs "$CANDIDATE_DIR"

      - name: Upload Storybook colour diagnostics
        if: always() && matrix.storybook != ''
        uses: actions/upload-artifact@v4
        with:
          name: storybook-colour-diagnostics-${{ matrix.job }}
          path: ${{ runner.temp }}/storybook-colour-audit
          if-no-files-found: ignore
          retention-days: 3

  # The single aggregate status: passes only when every job above passed. A
  # failed, cancelled, or skipped job fails it.
  check:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          echo "run=$RUN_RESULT"
          [ "$RUN_RESULT" = success ]

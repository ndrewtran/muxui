name: Repository planning policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-planning-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate issue-form YAML
        run: >-
          ruby -e 'require "yaml";
          Dir[".github/ISSUE_TEMPLATE/*.{yml,yaml}"].sort.each {
            |path| YAML.safe_load(File.read(path), permitted_classes: [], aliases: false)
          }'

      - name: Require authority files
        run: |
          test -s strategy/monorepo-architecture.md
          test -s strategy/milestone-roadmap.md
          test -s strategy/product-scope.md

      - name: Test planning policy
        run: node --test .github/scripts/validate-planning-pr.test.cjs

      - name: Enforce authority-change metadata
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
            );

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const labels = pullRequest.labels.map((label) => label.name);
            const validator = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/validate-planning-pr.cjs`,
            );
            const errors = validator.validatePlanningPullRequest({
              files: validator.changedPaths(files),
              labels,
              body: pullRequest.body || '',
            });
            for (const error of errors) {
              core.setFailed(error);
            }

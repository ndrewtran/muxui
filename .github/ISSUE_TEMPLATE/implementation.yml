name: Bounded implementation task
description: Propose an implementation task under an activated roadmap milestone.
title: "[Implementation] "
labels:
  - type:implementation
body:
  - type: input
    id: parent
    attributes:
      label: Parent milestone issue
      placeholder: "#123"
    validations:
      required: true
  - type: input
    id: scope_ids
    attributes:
      label: Scope ID(s)
      placeholder: SCOPE-COMP-BUTTON-REACT; SCOPE-REACT-BREADTH-001
    validations:
      required: true
  - type: input
    id: roadmap_milestone
    attributes:
      label: Roadmap milestone
      placeholder: R1 exit
    validations:
      required: true
  - type: textarea
    id: architecture_requirements
    attributes:
      label: Architecture requirements
      description: Cite exact headings and non-negotiable invariants governing the change.
    validations:
      required: true
  - type: input
    id: evidence_ids
    attributes:
      label: Evidence ID(s)
      placeholder: E-R1-EXIT-01
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Name the bounded canonical owners, derived projections, packages, and supported platforms.
    validations:
      required: true
  - type: textarea
    id: acceptance_commands
    attributes:
      label: Acceptance commands
      description: Include required positive, negative, generation, parity, compatibility, accessibility, and packed checks as applicable.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Bounded change
      description: Name canonical owners, projections, packages, and platforms affected.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Required proof
      description: Include positive paths, negative paths, compatibility, accessibility, and deterministic-output evidence as applicable.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: input
    id: change_record
    attributes:
      label: Pull request or change record
      placeholder: "#123 or branch/change-record reference"
    validations:
      required: true
  - type: checkboxes
    id: ownership
    attributes:
      label: Ownership checks
      options:
        - label: I identified the earliest editable canonical owner.
          required: true
        - label: I am not introducing a second registry or hand-maintained projection.
          required: true

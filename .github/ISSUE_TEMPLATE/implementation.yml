name: Bounded implementation task
description: Propose a bounded implementation task.
title: "[Implementation] "
labels:
  - type:implementation
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome and why it is needed.
    validations:
      required: true
  - type: textarea
    id: canonical_owner
    attributes:
      label: Canonical owner
      description: The earliest editable source this changes, such as a canonical record, renderer source, schema, token, or tool. Generated output is never the owner.
    validations:
      required: true
  - type: textarea
    id: affected_behavior
    attributes:
      label: Affected behavior
      description: What changes for users, consumers, or tooling, and what stays the same.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The checks that prove it, positive and negative paths as the risk calls for.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Where they apply, the Scope ID(s), Roadmap milestone, Evidence ID(s), and pull request or change record. An experimental React addition may use SCOPE-REACT-DONOR-SUPPLEMENTAL-001.
      placeholder: |
        Scope ID(s):
        Roadmap milestone:
        Evidence ID(s):
        Pull request or change record:
    validations:
      required: false

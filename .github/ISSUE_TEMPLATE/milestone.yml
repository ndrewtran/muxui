name: Roadmap milestone
description: Track one milestone from the Roadmap current milestone register.
title: "[Milestone] "
labels:
  - type:milestone
body:
  - type: markdown
    attributes:
      value: |
        The roadmap is normative. This issue records mutable execution state and must not weaken its entry conditions, evidence assertions, or scope controls.
  - type: dropdown
    id: roadmap_milestone
    attributes:
      label: Roadmap milestone
      options:
        - R1 exit
        - P2.1
        - P2.2
        - P2.3
        - P2 exit
        - W1.0
        - N1.0
        - X1.0
        - S1.0
        - BL1
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Copy the objective faithfully or link to its exact roadmap heading.
    validations:
      required: true
  - type: textarea
    id: entry_conditions
    attributes:
      label: Entry conditions and dependencies
      description: State the proof required before this issue may move to ready.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Locked deliverables
      description: List named owners and outputs. Scope growth requires a separate architecture-maintenance decision.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence IDs
      placeholder: E-P2.1-01
    validations:
      required: true
  - type: input
    id: product_scope
    attributes:
      label: Product Scope IDs
      description: Use immutable IDs from strategy/product-scope.md; do not use Pending, TBD, or inferred IDs.
      placeholder: SCOPE-REACT-BREADTH-001
    validations:
      required: true
  - type: textarea
    id: architecture_requirements
    attributes:
      label: Architecture requirements
      description: Cite the governing sections and non-negotiable invariants.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Scope controls and non-goals
      description: Preserve the roadmap exclusions that keep this milestone bounded.
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit condition
    validations:
      required: true
  - type: textarea
    id: acceptance_commands
    attributes:
      label: Acceptance commands
      description: Name deterministic commands, fixtures, negative paths, environments, and evidence owners.
    validations:
      required: true
  - type: input
    id: change_record
    attributes:
      label: Pull request or change record
      placeholder: "#123 or branch/change-record reference"
    validations:
      required: true
  - type: checkboxes
    id: discipline
    attributes:
      label: Activation discipline
      options:
        - label: Every entry condition is proved before status changes to ready.
          required: true
        - label: Every exit assertion will have a retained evidence issue or packet.
          required: true
        - label: Generated outputs will not be patched as canonical input.
          required: true

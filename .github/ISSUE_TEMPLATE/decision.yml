name: Bounded decision
description: Record a decision that changes a rule, commitment, or protected stop.
title: "[Decision] "
labels:
  - type:decision
body:
  - type: textarea
    id: question
    attributes:
      label: Decision question
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome and reversal conditions
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Authority and tracker effect
      description: Where they apply, the affected architecture sections, Roadmap milestones and evidence IDs, Product Scope IDs, release boundary, non-goals, and open tracker work.
    validations:
      required: false

name: Evidence packet
description: Retain proof for one or more roadmap acceptance assertions.
title: "[Evidence] "
labels:
  - type:evidence
  - area:proof
body:
  - type: input
    id: assertions
    attributes:
      label: Evidence assertion IDs
      placeholder: E-R1-EXIT-01, E-P2.1-01
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent milestone issue
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: assertion
    attributes:
      label: Assertion being proved
      description: State the falsifiable claim; do not substitute a success-path demonstration.
    validations:
      required: true
  - type: textarea
    id: revisions
    attributes:
      label: Exact revisions and authority tuple
      description: Record source, artifact, binding, package, catalog, token, release-manifest, and environment revisions as applicable.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Reproduction procedure
      description: Commands, fixtures, inputs, environment, and expected outputs.
    validations:
      required: true
  - type: textarea
    id: retained_artifacts
    attributes:
      label: Retained artifacts
      description: Link logs, reports, snapshots, digests, matrices, and negative-path results. Avoid expiring local-only paths.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Pass
        - Fail
        - Inconclusive
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: Expiry or invalidation condition
      placeholder: Invalidated by a change to specRevision, package tuple, fixture, or proof environment
    validations:
      required: true
  - type: checkboxes
    id: completeness
    attributes:
      label: Packet completeness
      options:
        - label: Positive and required negative paths are retained.
          required: true
        - label: Provenance is sufficient to reproduce this packet from a clean checkout.
          required: true
        - label: No generated artifact was patched to manufacture the result.
          required: true

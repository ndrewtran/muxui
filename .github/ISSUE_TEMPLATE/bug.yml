name: Bug
description: Report reproducible behaviour that looks wrong.
labels: [type:bug]
body:
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction, description: "Steps, code or a link." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual, description: Include any errors or console output. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit, placeholder: "@muxui/react 0.x.y-rc.n or a commit" }
  - type: input
    id: browser
    attributes: { label: Browser and engine, placeholder: "Safari 26, WebKit" }
